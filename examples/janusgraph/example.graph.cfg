# PID example.graph — read by graph.xml via cm:property-placeholder.
# Same keys as the old rahla.graphsource-<name>.cfg; keep secrets out of git (mount over this file).
hosts=localhost
port=8182
user=
pass=
graphTraversalSourceName=g
serializer=org.apache.tinkerpop.gremlin.util.ser.GraphBinaryMessageSerializerV1
ioRegistries=org.janusgraph.graphdb.tinkerpop.JanusGraphIoRegistry
minConnectionPoolSize=2
maxConnectionPoolSize=8
maxWaitForConnection=3000
