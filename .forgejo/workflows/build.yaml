name: Java Build & Release

on: push

jobs:
  build:
    runs-on: docker

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Maven
        run: |
          apt update -qq && apt install -qq -y maven
          mvn --batch-mode --update-snapshots clean package 

      - name: Set up docker
        run: |
          apt update -qq
          apt install -qq -y docker.io

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            docker.io/datatactics/rahla
            #dttctcs/rahla problem with dockerhub
          tags: |
            type=raw,latest
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=
                
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      
      # Push (and sign) only from main and release tags. Every other branch —
      # notably renovate/* — is built as a CI gate only: Renovate's automerge
      # waits for this job, and must not overwrite `latest` on the way.
      - name: Decide whether to push
        id: push
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main|refs/tags/*) echo "push=true"  >> $GITHUB_OUTPUT ;;
            *)                           echo "push=false" >> $GITHUB_OUTPUT ;;
          esac

      - name: Login to Dockerhub
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1.14.1
        with:          
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}          
      
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.push.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SPDX SBOM as in-toto attestations next to the
          # image (unsigned on their own — the cosign signature below covers
          # the image index they hang off).
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: steps.push.outputs.push == 'true'
        uses: https://github.com/sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Key-based signing: public Fulcio/keyless does not accept Forgejo as an
      # OIDC issuer. Verify with the committed public key:
      #   cosign verify --key cosign.pub docker.io/datatactics/rahla:<tag>
      - name: Sign image (cosign)
        if: steps.push.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -eu
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::secret COSIGN_PRIVATE_KEY is missing — image pushed unsigned"
            exit 1
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "docker.io/datatactics/rahla@${DIGEST}"

  forgejo-release:
    name: Forgejo Release
    runs-on: docker
    needs: build
    # Counterpart to .github/workflows/release.yaml, which only ever runs on the
    # GitHub mirror: Forgejo ignores .github/ entirely while .forgejo/ exists, so
    # without this job the Releases tab on repo.priv.datatactics.de stays empty.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Extract changelog section for this tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          apt update -qq && apt install -qq -y jq
          VERSION="${REF_NAME#v}"               # v1.3.5 -> 1.3.5
          # Pull the block under "# <version> ..." up to the next "# " heading.
          awk -v ver="$VERSION" '
            $0 ~ /^# / { if (inblk) exit; if ($0 ~ ("^# " ver "([ ]|$)")) { inblk=1; next } }
            inblk { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${REF_NAME}. See CHANGELOG.md for details." > release-notes.md
          fi
          echo "----- release notes -----"; cat release-notes.md

      - name: Create Forgejo release
        env:
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          jq -Rs --arg tag "$REF_NAME" \
            '{tag_name: $tag, name: $tag, body: ., draft: false, prerelease: false}' \
            release-notes.md > payload.json
          CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases" \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          echo "HTTP ${CODE}"; cat response.json
          # 201 created; 409 means the release already exists (e.g. re-run) -> not a failure
          case "$CODE" in
            201|409) ;;
            *) exit 1 ;;
          esac

  trivy-scan:
    name: Trivy SBOM -> Dependency Track
    runs-on: docker
    needs: build
    # only on a release tag (pushed by release.yaml's "Run workflow" button, or
    # by a local `mvn release:prepare`)
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Set version & filename
        id: set-filename
        env:
          REF_NAME: ${{ github.ref_name }}          # reliable in Forgejo (FORGEJO_REF_NAME may be unset)
        run: |
          VERSION="${REF_NAME#v}"                    # v1.3.3 -> 1.3.3 (matches the docker semver tag)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "filename=sbom_rahla_${VERSION}.json" >> $GITHUB_OUTPUT

      # Trivy scan + Dependency-Track upload live in the shared actions repo
      # (https://codeberg.org/datatactics/forgejo-actions) so the ~20 consuming
      # repos don't each carry a copy of this script.
      - name: Trivy SBOM (CycloneDX) of the released image
        id: sbom
        uses: https://codeberg.org/datatactics/forgejo-actions/trivy-sbom@main
        with:
          image: docker.io/datatactics/rahla:${{ steps.set-filename.outputs.version }}
          output: ${{ steps.set-filename.outputs.filename }}
        env:
          TRIVY_USERNAME: ${{ vars.DOCKERHUB_USER }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_PASS }}

      - name: Upload SBOM to Dependency Track
        uses: https://codeberg.org/datatactics/forgejo-actions/dtrack-upload@main
        with:
          bom: ${{ steps.sbom.outputs.sbom-file }}
          project-name: datatactics/rahla
          project-version: ${{ steps.set-filename.outputs.version }}
          parent-uuid: cff07b40-c95c-47e9-9367-cb9e8df75dcd   # rahla parent project in Dependency Track
        env:
          DTRACK_URL: ${{ vars.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
