name: Prepare Release

# The "Run workflow" button for cutting a release: runs maven-release-plugin
# locally and publishes its two `[maven-release-plugin] prepare release/next
# iteration` commits and the `vX.Y.Z` tag. Everything downstream hangs off that tag push
# in build.yaml (docker image, Trivy -> Dependency Track, Forgejo release), so
# this workflow deliberately does nothing but the version bump.
#
# Why a PAT and not the built-in token: Forgejo never triggers a workflow as a
# side effect of a change authored with the built-in token
# (https://forgejo.org/docs/latest/user/actions/). Pushing the tag with it would
# land the tag but silently skip build.yaml. One-time setup:
#   Settings -> Actions -> Secrets -> RELEASE_TOKEN = PAT with write:repository
#   (optional) Settings -> Actions -> Variables -> RELEASE_USER = that PAT's owner
#
# Why the commits go through the API instead of `git push`: main requires
# signed commits, and Forgejo signs only what it commits itself (instance key,
# `[repository.signing] CRUD_ACTIONS = always`). A pushed, unsigned release
# commit is rejected with "branch main is protected from unverified commit"
# (run 202, 2026-11-11). So release:prepare runs with -DpushChanges=false and
# every local commit is replayed through `POST .../contents`; the tag itself is
# pushed with git, because that push is what triggers build.yaml.
# The owner of RELEASE_TOKEN must be on the push whitelist of main's branch
# protection — the API honours neither "push disabled" nor an admin exemption.
#
# Only release:prepare runs — the pom has no <distributionManagement>, so
# release:perform would have nowhere to deploy to.
#
# Nightly auto-release (schedule): cuts a patch release on its own, but ONLY
# when every commit since the last tag was authored by Renovate (ignoring the
# `[maven-release-plugin]` commits and merge commits). Typical case: the
# automerged `renovate/base-images` PR (LSIO alpine digest + Temurin JRE). As
# soon as a human commit sits on main, the nightly run skips and the release
# is cut by hand via the button. The gate also writes the CHANGELOG entry for
# the bot commits, so nobody has to.

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC, at most one release per day
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version, e.g. 1.3.5 (empty = current version without -SNAPSHOT)'
        required: false
        type: string
      developmentVersion:
        description: 'Next development version, e.g. 1.3.6-SNAPSHOT (empty = patch + 1)'
        required: false
        type: string
      dryRun:
        description: 'Dry run — resolve versions and build, but commit/tag/push nothing'
        required: false
        type: boolean
        default: false

jobs:
  prepare-release:
    name: mvn release:prepare
    runs-on: docker

    steps:
      - name: Guard — main only, RELEASE_TOKEN present
        env:
          REF: ${{ github.ref }}
          DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::releases are cut from main only (got ${REF})"
            exit 1
          fi
          # A dry run pushes nothing, so it is allowed to run without the token —
          # that way the whole pipeline can be tested before the PAT exists.
          if [ -z "$RELEASE_TOKEN" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::no RELEASE_TOKEN — fine for a dry run, but a real release needs it"
            else
              echo "::error::secret RELEASE_TOKEN is missing — without it the tag push would not trigger build.yaml"
              exit 1
            fi
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0            # release:prepare needs the full history + tags
          persist-credentials: false  # auth comes from the credential store below

      - name: Auto-release gate (nightly only)
        id: gate
        if: github.event_name == 'schedule'
        shell: bash
        env:
          RENOVATE_EMAIL: renovate-bot@datatactics.de
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          LAST=$(git describe --tags --abbrev=0 --match 'v*')
          # the bot's commits and everyone else's, release-plugin + merges ignored
          log() { git log --no-merges --format='%ae%x09%s' "${LAST}..HEAD" | grep -v $'\t\[maven-release-plugin\]' || true; }
          BOT=$(log | awk -F'\t' -v e="$RENOVATE_EMAIL" '$1 == e { print $2 }')
          OTHER=$(log | awk -F'\t' -v e="$RENOVATE_EMAIL" '$1 != e { print $1 ": " $2 }')
          if [ -z "$BOT" ]; then
            echo "nothing new since ${LAST} — no release"
            echo "skip=true" >> $GITHUB_OUTPUT; exit 0
          fi
          if [ -n "$OTHER" ]; then
            echo "::warning::non-Renovate commits since ${LAST} — no auto-release, cut it by hand:"
            echo "$OTHER"
            echo "skip=true" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

          # CHANGELOG: one bullet per bot commit, plus the resolved image refs
          # (the grouped base-image commit is just "Update base images").
          ref() { git show "$1:Dockerfile" | sed -n "s|^FROM \(\S*$2\S*\).*|\1|p" | head -1; }
          {
            echo "### Dependency Updates"
            echo
            echo "$BOT" | sed 's/^/* Renovate: /'
            for img in eclipse-temurin baseimage-alpine; do
              OLD=$(ref "$LAST" "$img"); NEW=$(ref HEAD "$img")
              if [ -n "$NEW" ] && [ "$OLD" != "$NEW" ]; then
                echo "* \`${NEW%%@*}\` → \`@${NEW##*@}\`${OLD:+ (was \`${OLD}\`)}"
              fi
            done
            echo
          } > bullets.md
          cat bullets.md
          # insert right below the "# X.Y.Z (unreleased)" heading
          awk 'NR==FNR { b = b $0 "\n"; next }
               !done && /^# .*\(unreleased\)/ { print; print ""; printf "%s", b; done=1; getline; if ($0 != "") print; next }
               { print }' bullets.md CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          rm bullets.md
          git --no-pager diff -- CHANGELOG.md | head -30

      - name: Set up JDK 21
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install maven
        if: steps.gate.outputs.skip != 'true'
        run: apt update -qq && apt install -qq -y maven jq

      - name: Work out versions
        if: steps.gate.outputs.skip != 'true'
        id: versions
        env:
          IN_RELEASE: ${{ github.event.inputs.releaseVersion }}
          IN_DEV: ${{ github.event.inputs.developmentVersion }}
        run: |
          set -eu
          CURRENT=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          RELEASE="${IN_RELEASE:-${CURRENT%-SNAPSHOT}}"
          if [ -n "$IN_DEV" ]; then
            DEV="$IN_DEV"
          else
            MAJOR="${RELEASE%%.*}"; REST="${RELEASE#*.}"
            MINOR="${REST%%.*}";    PATCH="${REST#*.}"
            DEV="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          fi
          echo "release=${RELEASE}" >> $GITHUB_OUTPUT
          echo "dev=${DEV}" >> $GITHUB_OUTPUT
          echo "${CURRENT}  ->  release ${RELEASE}, tag v${RELEASE}, next ${DEV}"

      - name: Configure git
        if: steps.gate.outputs.skip != 'true'
        env:
          SERVER_URL: ${{ github.server_url }}
          ACTOR: ${{ github.actor }}
          RELEASE_USER: ${{ vars.RELEASE_USER }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          # Credentials via the store, not on the maven command line or in the
          # remote URL — keeps the token out of process args and push output.
          # Skipped when there is no token, which only happens on a dry run.
          if [ -n "$RELEASE_TOKEN" ]; then
            git config --global credential.helper store
            printf 'https://%s:%s@%s\n' \
              "${RELEASE_USER:-$ACTOR}" "$RELEASE_TOKEN" "${SERVER_URL#https://}" > "$HOME/.git-credentials"
            chmod 600 "$HOME/.git-credentials"
          fi
          git config --global user.name "$ACTOR"
          # matches the noreply domain Forgejo already uses for merge commits
          git config --global user.email "${ACTOR}@noreply.datatactics.de"
          git config --global --add safe.directory "$PWD"
          # release:prepare pushes to the pom's <developerConnection>
          # (https://repo.datatactics.dev/...), but the credentials above are
          # stored for SERVER_URL. Without this rewrite: "could not read
          # Username for 'https://repo.datatactics.dev'" (run 139, 2026-10-27).
          git config --global url."${SERVER_URL}/".insteadOf "https://repo.datatactics.dev/"

      # Mirrors what was done by hand until now, e.g. cfc0729 "docs: finalize
      # 1.3.4 changelog (date 2026-07-06)" sitting right before the release
      # commit: date the section being released and open one for the next
      # version. Committed before release:prepare, which requires a clean tree
      # and pushes this commit along with its own two.
      - name: Date the changelog section
        if: steps.gate.outputs.skip != 'true'
        env:
          RELEASE: ${{ steps.versions.outputs.release }}
          DEV: ${{ steps.versions.outputs.dev }}
        run: |
          set -eu
          DATE=$(date -u +%F)
          NEXT="${DEV%-SNAPSHOT}"
          ESC=$(printf '%s' "$RELEASE" | sed 's/\./\\./g')

          if grep -qE "^# ${ESC}([ ]|\$)" CHANGELOG.md; then
            sed -i -E "s|^# ${ESC}([ ].*)?\$|# ${RELEASE} (${DATE})|" CHANGELOG.md
          else
            echo "::warning::CHANGELOG.md has no '# ${RELEASE}' section — both release objects will fall back to a one-line note"
          fi

          if ! grep -qE "^# $(printf '%s' "$NEXT" | sed 's/\./\\./g')([ ]|\$)" CHANGELOG.md; then
            { printf '# %s (unreleased)\n\n' "$NEXT"; cat CHANGELOG.md; } > CHANGELOG.next
            mv CHANGELOG.next CHANGELOG.md
          fi

          git --no-pager diff -- CHANGELOG.md | head -20
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "nothing to stamp"
          else
            git commit -m "docs: finalize ${RELEASE} changelog (date ${DATE})"
          fi

      - name: mvn release:prepare
        if: steps.gate.outputs.skip != 'true'
        env:
          RELEASE: ${{ steps.versions.outputs.release }}
          DEV: ${{ steps.versions.outputs.dev }}
          DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
        run: |
          set -eu
          # -Dtag is mandatory: the pom sets no <tagNameFormat>, so the plugin
          # default would produce `reactor-1.3.5` instead of `v1.3.5`.
          mvn --batch-mode release:clean release:prepare \
            -DreleaseVersion="${RELEASE}" \
            -DdevelopmentVersion="${DEV}" \
            -Dtag="v${RELEASE}" \
            -DpushChanges=false \
            -DdryRun="${DRY_RUN}"

      # Replays the local commits (changelog stamp, release, next iteration) on
      # main through the contents API, so Forgejo signs them. Blob SHAs of the
      # previous file versions are sent along: if main moved in the meantime the
      # API refuses instead of overwriting.
      - name: Publish commits via API, push the tag
        if: steps.gate.outputs.skip != 'true' && (github.event.inputs.dryRun || 'false') != 'true'
        shell: bash
        env:
          RELEASE: ${{ steps.versions.outputs.release }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BASE: ${{ github.sha }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          TAG_SHA=
          for C in $(git rev-list --reverse "${BASE}..HEAD"); do
            echo '[]' > "$TMP/files.json"
            while IFS=$'\t' read -r STATUS FILE; do
              case "$STATUS" in
                A) OP=create ;;
                M) OP=update ;;
                D) OP=delete ;;
                *) echo "::error::unexpected change ${STATUS} ${FILE} in ${C}"; exit 1 ;;
              esac
              : > "$TMP/content"; OLD=
              [ "$OP" = delete ] || git show "${C}:${FILE}" | base64 -w0 > "$TMP/content"
              [ "$OP" = create ] || OLD=$(git rev-parse "${C}^:${FILE}")
              jq --arg op "$OP" --arg path "$FILE" --arg sha "$OLD" --rawfile content "$TMP/content" \
                '. + [{operation: $op, path: $path}
                      + (if $op == "delete" then {} else {content: $content} end)
                      + (if $sha == "" then {} else {sha: $sha} end)]' \
                "$TMP/files.json" > "$TMP/files.next"
              mv "$TMP/files.next" "$TMP/files.json"
            done < <(git diff-tree --no-commit-id -r --no-renames --name-status "$C")

            git log -1 --format=%B "$C" > "$TMP/message"
            jq -n --rawfile message "$TMP/message" --slurpfile files "$TMP/files.json" \
              '{branch: "main", message: ($message | rtrimstr("\n")), files: $files[0]}' > "$TMP/body.json"
            SUBJECT=$(git log -1 --format=%s "$C")
            CODE=$(curl -sS -o "$TMP/response.json" -w '%{http_code}' -X POST "${API}/contents" \
              -H "Authorization: token ${RELEASE_TOKEN}" -H 'Content-Type: application/json' \
              --data-binary "@$TMP/body.json")
            if [ "$CODE" != 201 ]; then
              echo "::error::API commit '${SUBJECT}' failed with HTTP ${CODE}: $(head -c 500 "$TMP/response.json")"
              exit 1
            fi
            SHA=$(jq -r '.commit.sha' "$TMP/response.json")
            echo "${SHA}  ${SUBJECT}"
            case "$SUBJECT" in "[maven-release-plugin] prepare release "*) TAG_SHA="$SHA" ;; esac
          done
          if [ -z "$TAG_SHA" ]; then
            echo "::error::no '[maven-release-plugin] prepare release' commit found — nothing to tag"
            exit 1
          fi

          # release:prepare tagged its local (unpublished) commit; move the tag
          # to the commit Forgejo created and push it.
          git fetch --quiet origin main
          git tag -f "v${RELEASE}" "$TAG_SHA"
          git push origin "refs/tags/v${RELEASE}"

      - name: Summary
        if: steps.gate.outputs.skip != 'true'
        env:
          RELEASE: ${{ steps.versions.outputs.release }}
          DEV: ${{ steps.versions.outputs.dev }}
          DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — nothing was committed, tagged or pushed."
          else
            echo "Tag v${RELEASE} pushed; main is now on ${DEV}."
            echo "build.yaml picks the tag up: docker image, Trivy -> Dependency Track, Forgejo release."
          fi
